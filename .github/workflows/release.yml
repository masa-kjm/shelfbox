name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Runs the release-target build matrix and uploads short-lived artifacts
  # without creating a GitHub release. Use this against the release candidate
  # before pushing the version tag.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shelfbox

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # workflow_dispatch is an artifact-only dry run. A tag push is the release action, so validate its provenance and release metadata first.
      - name: Validate tag, version, and changelog
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"

          test "${version}" = "${manifest_version}"
          test -n "${manifest_version}"
          grep --fixed-strings --line-regexp "## ${tag}" CHANGELOG.md

          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify Cargo.lock is current
        if: github.event_name == 'push'
        uses: dtolnay/rust-toolchain@stable

      - name: Check locked dependency resolution
        if: github.event_name == 'push'
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  build:
    name: Build (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --bin shelfbox --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use_cross }}
        run: cross build --release --locked --bin shelfbox --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          staging="shelfbox-${{ github.ref_name }}-${{ matrix.target }}"
          binary="shelfbox"
          asset="${staging}.tar.gz"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="shelfbox.exe"
            asset="${staging}.zip"
          fi

          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${binary}" "$staging/"
          cp README.md LICENSE "$staging/"

          if [[ "${{ matrix.target }}" == *windows* ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${staging}' -DestinationPath '${asset}'"
          else
            tar czf "${asset}" "$staging"
          fi

          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Generate checksum
        shell: bash
        run: |
          sha256sum "${{ env.ASSET }}" > "${{ env.ASSET }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish-crates:
    name: Publish crates.io packages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ github.ref_name }}
      CRATES_IO_API_USER_AGENT: shelfbox-release/${{ github.ref_name }} (https://github.com/masa-kjm/shelfbox)

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crates.io token
        shell: bash
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Publish shelfbox-core
        shell: bash
        run: |
          version="${VERSION#v}"
          endpoint="https://crates.io/api/v1/crates/shelfbox-core/${version}"
          if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --user-agent "$CRATES_IO_API_USER_AGENT" "$endpoint")"; then
            echo "failed to query shelfbox-core ${version} on crates.io" >&2
            exit 1
          fi

          case "$status" in
            200)
              echo "shelfbox-core ${version} is already published"
              ;;
            404)
              cargo publish --locked --package shelfbox-core
              ;;
            *)
              echo "unexpected crates.io response for shelfbox-core ${version}: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Wait for shelfbox-core to become available
        shell: bash
        run: |
          version="${VERSION#v}"
          endpoint="https://crates.io/api/v1/crates/shelfbox-core/${version}"
          for attempt in {1..30}; do
            if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --user-agent "$CRATES_IO_API_USER_AGENT" "$endpoint")"; then
              echo "failed to query shelfbox-core ${version} on crates.io" >&2
              exit 1
            fi

            case "$status" in
              200)
                exit 0
                ;;
              404)
                sleep 10
                ;;
              *)
                echo "unexpected crates.io response for shelfbox-core ${version}: HTTP ${status}" >&2
                exit 1
                ;;
            esac
          done
          echo "shelfbox-core ${version} did not become available on crates.io" >&2
          exit 1

      - name: Publish shelfbox
        shell: bash
        run: |
          version="${VERSION#v}"
          endpoint="https://crates.io/api/v1/crates/shelfbox/${version}"
          if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --user-agent "$CRATES_IO_API_USER_AGENT" "$endpoint")"; then
            echo "failed to query shelfbox ${version} on crates.io" >&2
            exit 1
          fi

          case "$status" in
            200)
              echo "shelfbox ${version} is already published"
              ;;
            404)
              cargo publish --locked --package shelfbox
              ;;
            *)
              echo "unexpected crates.io response for shelfbox ${version}: HTTP ${status}" >&2
              exit 1
              ;;
          esac

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  update-homebrew-tap:
    name: Update Homebrew tap
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Dispatch tap update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          test -n "$HOMEBREW_TAP_TOKEN"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/masa-kjm/homebrew-tap/dispatches \
            -d "{\"event_type\":\"shelfbox-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}"
